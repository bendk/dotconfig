[user]
name = "Ben Dean-Kawamura"
email = "bdk@mozilla.com"

[fsmonitor]
backend = "watchman"

[ui]
#diff-formatter = ["oy", "$left", "$right"]

[revsets]
log = "ancestors(@)"
bookmark-advance-to = "closest_pushable(@)"

[revset-aliases]
'closest_pushable(to)' = 'heads(::to & ~description(exact:"") & (~empty() | merges()))'
'slice()' = 'slice(@)'
'slice(from)' = 'ancestors(reachable(from, mutable()), 2)'
'work()' = 'mutable() & mine()'

[aliases]
tug = ["bookmark", "advance"]
fetch = ["util", "exec", "--", "bash", "-c", """
echo "origin"
jj git fetch --remote origin
echo "upstream"
jj git fetch --remote upstream
""", ""]

nn = ["util", "exec", "--", "bash", "-c", """
jj new "$@"
jj new
""", ""]

pop = ["util", "exec", "--", "bash", "-c", """
jj squash
jj edit @-
""", ""]

squash-restore-desendants = ["restore", "--from", "@", "--into", "@-", "--restore-descendants"]
work = ["log", "-r", "ancestors(roots(work()), 2)"]
slice = ["util", "exec", "--", "bash", "-c", """
set -e
COMMIT="${1:-@}"
jj log -r "slice(${COMMIT})"
""", ""]
rebase-work = ["rebase", "-d", "main", "-r", "work()"]

github-push = ["util", "exec", "--", "bash", "-c", """
COMMIT="${1:-@-}"
jj bookmark set tmp -r "$COMMIT" --allow-backwards
jj git push -b tmp
echo "https://github.com/bendk/uniffi-rs/commit/tmp/"
""", ""]

d = ["diff"]
dr = ["diff", "--to", "@-"]
dp = ["diff", "-r", "@-"]
dpp = ["diff", "--from", "@--"]
dppp = ["diff", "--from", "@---"]
dm = ["diff", "--tool", "meld"]

[templates]
git_push_bookmark = '"bdk/push-" ++ change_id.short()'
